name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[routes]]
pattern = "mail.522661.xyz"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "898b6beb-f498-46c8-962d-6034914b2160"

[[kv_namespaces]]
binding = "kv"
id = "13f0984d673740cf89d933b78c31eb39"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-attachments"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["522661.xyz"]
admin = "admin@522661.xyz"

[build]
command = "pnpm --dir ../mail-vue install --frozen-lockfile && pnpm --dir ../mail-vue run build"
